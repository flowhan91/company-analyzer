[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-analyzer"
version = "0.1.0"
description = "JD-aware company intelligence: evidence-backed company timelines and threads"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "click>=8.1",
    "rapidfuzz>=3.9",
    "python-frontmatter>=1.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "openai>=1.50",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpserver>=1.1",
    "responses>=0.25",
]

[project.scripts]
cana = "company_analyzer.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
