{% extends "base.html" %}
{% block title %}타임라인 - {{ company_name }}{% endblock %}
{% block sidebar %}{% include "jd_panel.html" %}{% endblock %}
{% block content %}
  <h1>기업 타임라인</h1>
  <form method="get" style="margin-bottom:16px; display:flex; gap:12px; align-items:center;">
    <input type="hidden" name="company" value="{{ company_name }}">
    <label class="muted">도메인
      <select name="domain" onchange="this.form.submit()">
        <option value="">전체</option>
        {% for d in domains %}
          <option value="{{ d }}" {{ 'selected' if d == selected_domain else '' }}>{{ d }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="muted">
      <input type="checkbox" name="official_only" value="true" {{ 'checked' if official_only else '' }} onchange="this.form.submit()">
      공식 출처만 보기
    </label>
  </form>

  <label class="muted" id="jd-only-toggle-wrap" style="display:none; margin-bottom:12px; align-items:center; gap:6px;">
    <input type="checkbox" id="jd-only-toggle" onchange="document.getElementById('timeline-list').classList.toggle('jd-only', this.checked)">
    관련 이벤트만 보기
  </label>

  <div id="timeline-list">
    {% include "timeline_rows.html" %}
  </div>
{% endblock %}
